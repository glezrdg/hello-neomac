<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Neomac</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      color: #4ade80;
    }
    p { line-height: 1.6; opacity: 0.85; margin-bottom: 0.8rem; }
    code {
      background: rgba(0,0,0,0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.9em;
    }
    .meta {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">● live on VPS</span>
    <h1>Hello, Neomac</h1>
    <p>Esta página viaja por <code>git push origin main</code> → GitHub Actions → SSH al VPS → Docker → Traefik → tú.</p>
    <p>Si la estás viendo en <code>hello.neomac.io</code>, el pipeline funciona.</p>
    <div class="meta">deployed via push-to-main · neomac PaaS</div>
  </div>
</body>
</html>
