name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, neomac-vps]
    env:
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      SUBDOMAIN:    ${{ vars.SUBDOMAIN }}
      APP_PORT:     ${{ vars.APP_PORT || '3000' }}
    steps:
      - name: Sync repo to /opt/apps
        run: |
          set -euo pipefail
          cd /opt/apps
          if [ ! -d "${PROJECT_NAME}" ]; then
            git clone "git@github.com:${{ github.repository }}.git" "${PROJECT_NAME}"
          fi
          cd "${PROJECT_NAME}"
          git fetch origin main
          git reset --hard origin/main

      - name: Write .env.production (if provided)
        env:
          ENV_BLOB: ${{ secrets.ENV_PRODUCTION }}
        run: |
          set -euo pipefail
          cd "/opt/apps/${PROJECT_NAME}"
          if [ -n "${ENV_BLOB:-}" ]; then
            printf '%s\n' "${ENV_BLOB}" > .env.production
            chmod 600 .env.production
          else
            : > .env.production
          fi

      - name: Build & start container
        run: |
          set -euo pipefail
          cd "/opt/apps/${PROJECT_NAME}"
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
